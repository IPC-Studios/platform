name: Deploy

# Push to main -> migrate the database, then deploy the API + web. Configure the
# repo secrets listed below once (Settings -> Secrets and variables -> Actions)
# and every push ships all three. Manual run via the "Run workflow" button too.
#
# Required secrets:
#   SUPABASE_ACCESS_TOKEN   supabase.com -> Account -> Access Tokens
#   SUPABASE_PROJECT_REF    your project ref (Project Settings -> General)
#   SUPABASE_DB_PASSWORD    database password
#   CLOUDFLARE_API_TOKEN    Cloudflare -> My Profile -> API Tokens (Workers + Pages edit)
#   CLOUDFLARE_ACCOUNT_ID   Cloudflare dashboard URL / Workers overview
#   SUPABASE_URL            https://<ref>.supabase.co        (Worker runtime + web build)
#   SUPABASE_ANON_KEY       project anon key                 (Worker runtime + web build)
#   SUPABASE_SERVICE_ROLE_KEY   project service_role key     (Worker runtime only)
#   CRON_SECRET             any long random string
#   RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET / RAZORPAY_WEBHOOK_SECRET
#   ALLOWED_ORIGINS         e.g. https://app.yourstudio.com
#   API_BASE_URL            deployed worker URL, e.g. https://ipc-api.<sub>.workers.dev/

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  database:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Push migrations + seed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase db push --include-seed

  api:
    needs: database
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Sync Worker runtime secrets
        working-directory: services/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > /tmp/secrets.json <<JSON
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}",
            "SUPABASE_SERVICE_ROLE_KEY": "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}",
            "CRON_SECRET": "${{ secrets.CRON_SECRET }}",
            "RAZORPAY_KEY_ID": "${{ secrets.RAZORPAY_KEY_ID }}",
            "RAZORPAY_KEY_SECRET": "${{ secrets.RAZORPAY_KEY_SECRET }}",
            "RAZORPAY_WEBHOOK_SECRET": "${{ secrets.RAZORPAY_WEBHOOK_SECRET }}",
            "ALLOWED_ORIGINS": "${{ secrets.ALLOWED_ORIGINS }}"
          }
          JSON
          bunx wrangler secret bulk /tmp/secrets.json
      - name: Deploy Worker
        working-directory: services/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy

  web:
    needs: database
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build
        working-directory: apps/web
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: bun run build
      - name: Deploy Pages
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler pages deploy dist --project-name ipc-studios --branch main
