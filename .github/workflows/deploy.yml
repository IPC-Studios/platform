name: Deploy

# Push to main -> redeploy the backend (Postgres + API) on the VPS.
# The FRONTEND is deployed by Cloudflare's own Workers Builds (connected repo),
# so it isn't handled here.
#
# ── Two ways in, because one of them stopped working ─────────────────────
#
# The original design was: hosted runner -> SSH -> VPS. That broke three
# deploys running. `dial tcp ***:22: i/o timeout` means the TCP connection
# never opened — not a refused login, not a bad key, but packets dropped
# before sshd ever saw them. Port 22 is open from an ordinary machine, so the
# host and sshd are fine and something is dropping GitHub's addresses
# specifically: fail2ban, a firewall allowlist, or a provider block. Runner IPs
# rotate every run, so repeated deploys look a lot like distributed SSH
# probing, and a jail reacting to that will keep re-banning them however many
# times you unban.
#
# So the deploy no longer has to come IN. Set the repo VARIABLE DEPLOY_RUNNER
# to a self-hosted runner's label and the job runs on the VPS itself, deploying
# in place with no inbound connection at all — the runner polls GitHub
# outbound, which a block of this shape does not touch.
#
#   Install once on the VPS (repo Settings -> Actions -> Runners -> New runner;
#   it prints a ./config.sh line with a token), then:
#     sudo ./svc.sh install && sudo ./svc.sh start
#   Then set the repo variable  DEPLOY_RUNNER = self-hosted
#
# Leave DEPLOY_RUNNER unset and it behaves exactly as before, over SSH — still
# the right choice if the block is ever diagnosed and lifted.
#
# ── Before reaching for the runner, check the cheap thing ────────────────
# An i/o timeout is also what a STALE VPS_HOST looks like. If that secret holds
# an IP and the box has since moved, every deploy times out while the app stays
# perfectly reachable on its DNS name. Compare the secret against what the
# API's hostname resolves to before assuming a firewall.
#
# One-time VPS setup (see docs/vps-deploy.md):
#   clone this repo on the server (deploy key, private), create .env, install Docker.
#
# Required repo secrets:
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PATH   (optional VPS_PORT, default 22)
#   VPS_PATH is used by both paths; the rest only by SSH.
# Optional: API_DOMAIN, for the checks below.
# Arm it with repo variable DEPLOY_ENABLED=true.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  api:
    # Self-hosted when DEPLOY_RUNNER is set, GitHub-hosted otherwise.
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      # An SSH timeout says nothing about why. This separates "the box is gone"
      # from "port 22 specifically is unreachable" — different problems with
      # different fixes. Skipped on a self-hosted runner, which is already
      # inside the machine and has nothing to prove.
      - name: Is the host actually up?
        if: ${{ vars.DEPLOY_RUNNER == '' }}
        continue-on-error: true
        env:
          API_DOMAIN: ${{ secrets.API_DOMAIN }}
        run: |
          if [ -z "$API_DOMAIN" ]; then
            echo "::notice::Set the API_DOMAIN repo secret to turn an SSH timeout below"
            echo "::notice::into a diagnosis — it is the one check that tells you whether"
            echo "::notice::the machine is down or only port 22 is blocked."
            exit 0
          fi
          if curl -fsS --max-time 15 "https://$API_DOMAIN/health"; then
            echo
            echo "::notice::Host is serving HTTPS. If the SSH step below times out, the"
            echo "::notice::machine is fine and port 22 alone is blocked — check fail2ban"
            echo "::notice::(fail2ban-client status sshd) and the firewall, and confirm"
            echo "::notice::VPS_HOST still matches this host's current address. The lasting"
            echo "::notice::fix is a self-hosted runner: set the DEPLOY_RUNNER variable."
          else
            echo "::warning::Host is not answering on HTTPS either — this looks like the"
            echo "::warning::machine or its network rather than SSH."
          fi

      # ── In place, on the VPS ─────────────────────────────────
      - name: Deploy on the VPS (self-hosted runner)
        if: ${{ vars.DEPLOY_RUNNER != '' }}
        env:
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -eu
          cd "$VPS_PATH"
          git fetch origin main
          git checkout -B main origin/main
          sh deploy/deploy.sh

      # ── Over SSH, from a hosted runner ───────────────────────
      - name: Deploy backend over SSH
        if: ${{ vars.DEPLOY_RUNNER == '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            cd "${{ secrets.VPS_PATH }}"
            git fetch origin main
            git checkout -B main origin/main
            sh deploy/deploy.sh

      # A green job is not proof the code is running. /health reports the
      # commit it was built from, so compare it with the one being deployed.
      - name: Confirm what is actually running
        if: ${{ always() }}
        continue-on-error: true
        env:
          API_DOMAIN: ${{ secrets.API_DOMAIN }}
        run: |
          if [ -z "$API_DOMAIN" ]; then exit 0; fi
          echo "Deploying: $GITHUB_SHA"
          RUNNING=$(curl -fsS --max-time 20 "https://$API_DOMAIN/health" || echo '{}')
          echo "Running:   $RUNNING"
          case "$RUNNING" in
            *"$GITHUB_SHA"*) echo "::notice::The API reports the commit just deployed." ;;
            *) echo "::warning::/health does not report $GITHUB_SHA. Either the deploy did"
               echo "::warning::not land, or APP_VERSION is not being stamped — check the"
               echo "::warning::deploy step above rather than trusting this job's status." ;;
          esac
