name: Deploy

# Push to main -> deploy the backend to the VPS (SSH + Docker Compose) and the
# web frontend to Cloudflare Pages. The two jobs are independent.
#
# Backend (job: api) — one-time VPS setup (see docs/vps-deploy.md):
#   clone this repo on the server (deploy key, private), create .env, install Docker.
#   Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PATH  (optional VPS_PORT)
#
# Frontend (job: web) — Cloudflare Pages:
#   Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, API_BASE_URL
#            (API_BASE_URL = https://api.yourstudio.in, baked into the build)
#
# Arm both with repo variable DEPLOY_ENABLED=true.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  api:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Deploy backend over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            cd "${{ secrets.VPS_PATH }}"
            git fetch --prune origin
            git reset --hard origin/main
            docker compose up -d --build --wait --remove-orphans
            docker compose ps

  web:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: bun run build
      - name: Deploy to Cloudflare Pages
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler pages deploy dist --project-name ipc-studios --branch main
