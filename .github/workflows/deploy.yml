name: Deploy

# Push to main -> SSH into the VPS and redeploy the backend (Postgres + API).
# The FRONTEND is deployed by Cloudflare's own Workers Builds (connected repo),
# so it isn't handled here.
#
# One-time VPS setup (see docs/vps-deploy.md):
#   clone this repo on the server (deploy key, private), create .env, install Docker.
#
# Required repo secrets:
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PATH   (optional VPS_PORT, default 22)
# Arm it with repo variable DEPLOY_ENABLED=true.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  api:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      # An SSH timeout says nothing about why. This separates "the box is gone"
      # from "port 22 specifically is unreachable" — different problems with
      # different fixes, and the second has now happened twice in a day.
      - name: Is the host actually up?
        continue-on-error: true
        env:
          API_DOMAIN: ${{ secrets.API_DOMAIN }}
        run: |
          if [ -z "$API_DOMAIN" ]; then
            echo "::notice::Set the API_DOMAIN repo secret to turn an SSH timeout below"
            echo "::notice::into a diagnosis — it is the one check that tells you whether"
            echo "::notice::the machine is down or only port 22 is blocked."
            exit 0
          fi
          if curl -fsS --max-time 15 "https://$API_DOMAIN/health"; then
            echo
            echo "::notice::Host is serving HTTPS. If the SSH step below times out, the"
            echo "::notice::machine is fine and port 22 alone is blocked — check fail2ban"
            echo "::notice::(fail2ban-client status sshd) and the firewall for a ban on the"
            echo "::notice::runner's address. Runner IPs rotate, so repeated deploys can"
            echo "::notice::look like distributed SSH attempts."
          else
            echo "::warning::Host is not answering on HTTPS either — this looks like the"
            echo "::warning::machine or its network rather than SSH."
          fi

      - name: Deploy backend over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          envs: GIT_SHA
          script: |
            cd "${{ secrets.VPS_PATH }}"
            git fetch origin main
            git checkout -B main origin/main
            # Stamp the release the containers will report. Without this every
            # Sentry issue and every /health response says "dev", and nobody
            # can tell which deploy introduced a problem. Rewritten in place so
            # .env keeps every other value it holds.
            if grep -q '^APP_VERSION=' .env; then
              sed -i "s|^APP_VERSION=.*|APP_VERSION=${GIT_SHA}|" .env
            else
              echo "APP_VERSION=${GIT_SHA}" >> .env
            fi
            # This VPS runs Coolify (its Traefik terminates TLS on 80/443), so we
            # use the coolify overlay and omit our own caddy. --wait blocks on the
            # db/api healthchecks.
            # Services are named explicitly (caddy is deliberately omitted — see
            # the overlay). Anything added to docker-compose.yml must be added
            # HERE too, or it is defined and never started: cron-attendance sat
            # in the compose file unrun because of exactly that, which meant the
            # nightly absent sweep never fired.
            docker compose -f docker-compose.yml -f docker-compose.coolify.yml \
              up -d --build --wait --remove-orphans \
              db migrate api cron cron-attendance backup
            docker compose ps
