name: Deploy

# Push to main -> SSH into the VPS and redeploy the backend (Postgres + API).
# The FRONTEND is deployed by Cloudflare's own Workers Builds (connected repo),
# so it isn't handled here.
#
# One-time VPS setup (see docs/vps-deploy.md):
#   clone this repo on the server (deploy key, private), create .env, install Docker.
#
# Required repo secrets:
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PATH   (optional VPS_PORT, default 22)
# Arm it with repo variable DEPLOY_ENABLED=true.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  api:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Deploy backend over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            cd "${{ secrets.VPS_PATH }}"
            git fetch origin main
            git checkout -B main origin/main
            # Testing (no domain yet): bring up db + api only. Once a domain/TLS
            # is set, switch to `docker compose up -d --build --wait` for the full
            # stack (adds caddy + cron).
            docker compose up -d --build --wait db api
            docker compose ps
