name: Deploy

# Push to main -> SSH into the VPS, pull, and (re)launch the whole Docker Compose
# stack (Postgres + API + web + Caddy + cron). `--wait` blocks until the db and
# api healthchecks pass, so a broken deploy fails the job.
#
# One-time VPS setup (see docs/vps-deploy.md):
#   - clone this repo on the server (deploy key, since it's private)
#   - create .env there from deploy/.env.example
#   - install Docker Engine + Compose plugin
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   VPS_HOST      server hostname or IP
#   VPS_USER      ssh user (must be able to run docker)
#   VPS_SSH_KEY   that user's private key (PEM)
#   VPS_PATH      absolute path to the cloned repo on the server
# Optional secret:
#   VPS_PORT      ssh port (default 22)
#
# Set repo variable DEPLOY_ENABLED=true to arm it.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            cd "${{ secrets.VPS_PATH }}"
            git fetch --prune origin
            git reset --hard origin/main
            docker compose up -d --build --wait --remove-orphans
            docker compose ps
