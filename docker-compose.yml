# Self-hosted VPS BACKEND: Postgres + Bun API + Caddy (TLS) + cron ticker.
# No Supabase. The web frontend deploys separately to Cloudflare Pages.
#
#   cp deploy/.env.example .env   # fill in secrets + domains
#   docker compose up -d --build
#
# On first boot the db container runs deploy/db/init.sh: the bootstrap, then the
# migrations (0001..) in order. The API connects as the `authenticator` role and
# SET ROLEs per request, so RLS is enforced exactly as it was on Supabase.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ipc}
      DB_AUTHENTICATOR_PASSWORD: ${DB_AUTHENTICATOR_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./deploy/db/00_bootstrap.sql:/db/00_bootstrap.sql:ro
      - ./supabase/migrations:/db/migrations:ro
      - ./deploy/db/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ipc}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: [.env]
    environment:
      PORT: 8787
      # Built from the db credentials — the API is the `authenticator` role.
      DATABASE_URL: postgres://authenticator:${DB_AUTHENTICATOR_PASSWORD}@db:5432/${POSTGRES_DB:-ipc}
    expose:
      - "8787"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    env_file: [.env]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Replaces the Workers cron trigger: POST /cron/reminders every hour with the
  # shared secret. Idempotent server-side, so an occasional double-fire is safe.
  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on:
      - api
    env_file: [.env]
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          curl -fsS -X POST "http://api:8787/cron/reminders" \
            -H "x-cron-secret: $${CRON_SECRET}" >/dev/null 2>&1 || true
          sleep 3600
        done

volumes:
  db_data:
  caddy_data:
  caddy_config:
