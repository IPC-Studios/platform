# VPS deployment for the IPC API (alternative to Cloudflare Workers).
#
#   cp deploy/.env.example .env   # fill in secrets + domains
#   docker compose up -d --build
#
# Caddy terminates TLS (auto Let's Encrypt) and reverse-proxies to the Bun API;
# the cron service ticks the reminder job hourly. Supabase stays external.

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      PORT: 8787
    expose:
      - "8787"
    healthcheck:
      # Bun is in the image; hit the app's own /health.
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    env_file: [.env]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Replaces the Workers cron trigger: POST /cron/reminders every hour with the
  # shared secret. Idempotent server-side, so an occasional double-fire is safe.
  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on:
      - api
    env_file: [.env]
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          curl -fsS -X POST "http://api:8787/cron/reminders" \
            -H "x-cron-secret: $${CRON_SECRET}" >/dev/null 2>&1 || true
          sleep 3600
        done

volumes:
  caddy_data:
  caddy_config:
